name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting, Clippy, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Run reproducible lint checks
        run: nix build --no-update-lock-file --no-link --print-build-logs .#checks.x86_64-linux.lint
      - name: Check advisories, licenses, and dependency sources
        run: nix develop --no-update-lock-file --command cargo deny --locked check
