# Tools come from `nix develop`; no hooks download their own toolchains.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        language: system
        entry: cargo fmt --all -- --check
        pass_filenames: false
        always_run: true
      - id: clippy
        name: Strict Clippy
        language: system
        entry: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        pass_filenames: false
        always_run: true
      - id: rustdoc
        name: Documentation warnings and links
        language: system
        entry: cargo doc --locked --workspace --all-features --no-deps
        pass_filenames: false
        always_run: true
      - id: nixfmt
        name: Nix formatting
        language: system
        entry: nixfmt --check
        files: '\.nix$'
      - id: taplo
        name: TOML formatting
        language: system
        entry: taplo fmt --check
        types: [toml]
      - id: actionlint
        name: GitHub Actions validation
        language: system
        entry: actionlint
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: cargo-test
        name: Unit, integration, and documentation tests
        language: system
        entry: cargo test --locked --workspace --all-features
        pass_filenames: false
        always_run: true
        stages: [pre-push]
