# cargo-deny checks dependencies; choose your project's own license before publishing.
[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.95
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# The unpublished application needs no licensing decision to use this template.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
